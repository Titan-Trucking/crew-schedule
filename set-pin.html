<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Set PIN</title>
<style>
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f5f7;color:#1b1f24}
@media (prefers-color-scheme:dark){body{background:#121417;color:#e7e9ec}input,button,code{background:#1b1e23!important;color:inherit;border-color:#2d3239!important}}
.w{max-width:440px;margin:40px auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
input{font:inherit;padding:10px;border:1px solid #dcdfe3;border-radius:8px;font-size:20px;letter-spacing:.2em}
button{font:inherit;padding:10px;border:1px solid #2563a8;background:#2563a8!important;color:#fff!important;border-radius:8px;cursor:pointer}
code{display:block;word-break:break-all;padding:10px;border:1px solid #dcdfe3;border-radius:8px;background:#fff;font-size:13px}
p{margin:0}
</style>
</head>
<body>
<div class="w">
  <h1 style="margin:0;font-size:22px">Make a new PIN code</h1>
  <p>Type the new PIN (numbers only). Nothing is sent anywhere; this runs on your device.</p>
  <input id="p" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="New PIN">
  <button id="go">Make code</button>
  <div id="out" hidden>
    <p>In <b>config.js</b>, replace the long code after <b>pinHash:</b> with this one, and set <b>pinLength</b> to <b id="len"></b>:</p>
    <code id="h"></code>
  </div>
</div>
<script>
document.getElementById("go").onclick = async function(){
  var v = document.getElementById("p").value.trim();
  if (!/^[0-9]{4,8}$/.test(v)) { alert("Use 4 to 8 digits."); return; }
  var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("crew-schedule:" + v));
  document.getElementById("h").textContent = Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");
  document.getElementById("len").textContent = v.length;
  document.getElementById("out").hidden = false;
};
</script>
</body>
</html>
